name: rag-tests

on:
  push:
    paths: ["rag/**", ".github/workflows/rag-tests.yml"]
  pull_request:
    paths: ["rag/**", ".github/workflows/rag-tests.yml"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q tests
