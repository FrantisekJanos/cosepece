name: rag-tests

on:
  push:
    paths: ["rag/**", "docker/docker-compose.yml", "docker/.env.example", ".github/workflows/rag-tests.yml", "tisk.php", "pripravovane.php", "app/Url.php"]
  pull_request:
    paths: ["rag/**", "docker/docker-compose.yml", "docker/.env.example", ".github/workflows/rag-tests.yml", "tisk.php", "pripravovane.php", "app/Url.php"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # PostgreSQL jen pro testy (@pytest.mark.pg); bez hesla, přístup jen z běhu workflow
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: hlidac_rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/hlidac_rag_test
    defaults:
      run:
        working-directory: rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test "tests/js/*.test.mjs"
