# Provoz na serveru: docker compose -f docker/docker-compose.yml up -d --build
# Proměnné v docker/.env (vzor docker/.env.example).
services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment: &appenv
      HLIDAC_CONFIG: /run/hlidac/config.php
      DB_PASSWORD: ${DB_PASSWORD}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    ports:
      - "${BIND:-127.0.0.1:8100}:80"
    volumes:
      - ./config.php:/run/hlidac/config.php:ro
      - appdata:/var/www/html/data
      # veřejné kopie videí pro Instagram (/reels-media/<token>.mp4, Alias v docker/Dockerfile), jen čtení
      - reelsmedia:/srv/reels-media:ro
      # mezisložka Reels: reels_api.php sem ukládá videa a manifest.json od workeru na PC, bot je převezme
      - reelsinbox:/srv/reels-inbox
    depends_on: [db]

  # synchronizace s psp.cz každou hodinu (náhrada cronu)
  sync:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment: *appenv
    user: www-data
    volumes:
      - ./config.php:/run/hlidac/config.php:ro
      - appdata:/var/www/html/data
    # synchronizace potřebuje víc paměti než webová stránka (webu stačí 256M z app.ini)
    command: ["sh", "-c", "while true; do php -d memory_limit=1024M /var/www/html/bin/sync.php; sleep 3600; done"]
    depends_on: [db]

  # stenoprotokoly psp.cz → steno.* (každou hodinu; změny textu hlídá hash části)
  rag-ingest:
    build:
      context: ../rag
    restart: unless-stopped
    environment: &ragenv
      PGHOST: db
      PGDATABASE: hlidac
      PGUSER: hlidac
      PGPASSWORD: ${DB_PASSWORD}
      SENTRY_DSN: ${SENTRY_DSN_RAG:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-text-embedding-3-large}
      # stropy útraty OpenAI: tokeny indexace na hodinový běh (3 mil. ≈ 0,39 USD), embeddingy dotazů MCP za den (UTC)
      EMBED_MAX_TOKENS_PER_RUN: ${EMBED_MAX_TOKENS_PER_RUN:-3000000}
      EMBED_DOTAZY_DEN: ${EMBED_DOTAZY_DEN:-20000}
    command: ["sh", "-c", "while true; do python -m hlidac_rag.run; sleep 3600; done"]
    depends_on: [db]

  # MCP server (Streamable HTTP na /mcp). Tokeny: docker compose exec rag-ingest python -m hlidac_rag.tokens add <jméno>
  # (MCP sám do mcp.token zapisovat nesmí). Běží pod rolí mcp_ro jen pro čtení (rag/hlidac_rag/role.py, spec chatbota 21):
  # roli založí/obnoví docker compose exec -e MCP_DB_PASSWORD rag-ingest python -m hlidac_rag.role
  mcp:
    build:
      context: ../rag
    restart: unless-stopped
    environment:
      <<: *ragenv
      # přepíše PGUSER a PGPASSWORD z *ragenv: heslo superuseru hlidac do kontejneru nejde
      PGUSER: mcp_ro
      PGPASSWORD: ${MCP_DB_PASSWORD}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*}
    ports:
      - "${MCP_BIND:-127.0.0.1:8102}:8000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    depends_on: [db]

  # Chatbot (/chat-api/*, spec chatbota 16 a 21). Stejný obraz jako mcp, ale vlastní výčet prostředí (nikdy *ragenv:
  # nese heslo superuseru hlidac), role chat_ro (čtení dat) a chat_rw (jen schéma chat), síť jen chatdb (bez web, mcp,
  # reels). Role založí: docker compose exec -e CHAT_DB_RO_PASSWORD -e CHAT_DB_RW_PASSWORD rag-ingest python -m hlidac_rag.role
  # Nevyplněná proměnná = prázdná = výchozí hodnota z kódu (hlidac_rag/chat/config.py). Změna limitu: .env a
  # docker compose up -d chat. Vypnutí: CHAT_ZAPNUTO=0.
  chat:
    build:
      context: ../rag
    restart: unless-stopped
    command: ["python", "-m", "hlidac_rag.chat"]
    environment:
      PGHOST: db
      PGDATABASE: hlidac
      CHAT_DB_RO_USER: chat_ro
      CHAT_DB_RO_PASSWORD: ${CHAT_DB_RO_PASSWORD:-}
      CHAT_DB_RW_USER: chat_rw
      CHAT_DB_RW_PASSWORD: ${CHAT_DB_RW_PASSWORD:-}
      # vlastní klíče s limitem útraty (ne klíč ingestu): při úniku je škoda omezená limitem
      ANTHROPIC_API_KEY: ${CHAT_ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${CHAT_OPENAI_API_KEY:-}
      # embedding dotazu stejným modelem jako indexace v rag-ingest; denní strop embeddingů je společný s MCP
      EMBED_MODEL: ${EMBED_MODEL:-text-embedding-3-large}
      EMBED_DOTAZY_DEN: ${EMBED_DOTAZY_DEN:-20000}
      SENTRY_DSN: ${SENTRY_DSN_RAG:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # tajemství
      CHAT_BETA_KLIC: ${CHAT_BETA_KLIC:-}
      CHAT_BETA_KOD: ${CHAT_BETA_KOD:-}
      CHAT_EVAL_KLIC: ${CHAT_EVAL_KLIC:-}
      CHAT_TURNSTILE_SITEKEY: ${CHAT_TURNSTILE_SITEKEY:-}
      CHAT_TURNSTILE_SECRET: ${CHAT_TURNSTILE_SECRET:-}
      CHAT_TELEGRAM_TOKEN: ${CHAT_TELEGRAM_TOKEN:-}
      CHAT_TELEGRAM_CHAT: ${CHAT_TELEGRAM_CHAT:-}
      # vypínač, režim, model a limity (spec 10.2 a 11.1)
      CHAT_ZAPNUTO: ${CHAT_ZAPNUTO:-}
      CHAT_REZIM: ${CHAT_REZIM:-}
      CHAT_MODEL: ${CHAT_MODEL:-}
      CHAT_EFFORT: ${CHAT_EFFORT:-}
      CHAT_KARTA_JAKO: ${CHAT_KARTA_JAKO:-}
      CHAT_MODEL_NOUZOVY: ${CHAT_MODEL_NOUZOVY:-}
      CHAT_PRAH_NOUZE: ${CHAT_PRAH_NOUZE:-}
      CHAT_CENIK: ${CHAT_CENIK:-}
      CHAT_ROZPOCET_DEN_USD: ${CHAT_ROZPOCET_DEN_USD:-}
      CHAT_ROZPOCET_MESIC_USD: ${CHAT_ROZPOCET_MESIC_USD:-}
      CHAT_PODIL_HODINA: ${CHAT_PODIL_HODINA:-}
      CHAT_STROP_TAHU_USD: ${CHAT_STROP_TAHU_USD:-}
      CHAT_STROP_RELACE_USD: ${CHAT_STROP_RELACE_USD:-}
      CHAT_STROP_IP_USD: ${CHAT_STROP_IP_USD:-}
      CHAT_ZPRAV_RELACE_MIN: ${CHAT_ZPRAV_RELACE_MIN:-}
      CHAT_ZPRAV_RELACE_DEN: ${CHAT_ZPRAV_RELACE_DEN:-}
      CHAT_MAX_KOL: ${CHAT_MAX_KOL:-}
      CHAT_ROZPOCET_VYSLEDKU_TOKENU: ${CHAT_ROZPOCET_VYSLEDKU_TOKENU:-}
      CHAT_MAX_TOKENU_ODPOVEDI: ${CHAT_MAX_TOKENU_ODPOVEDI:-}
      CHAT_HISTORIE_MAX_TOKENU: ${CHAT_HISTORIE_MAX_TOKENU:-}
      CHAT_MAX_TAHU_KONVERZACE: ${CHAT_MAX_TAHU_KONVERZACE:-}
      CHAT_MAX_ZNAKU_ZPRAVY: ${CHAT_MAX_ZNAKU_ZPRAVY:-}
      CHAT_KARTA_MAX_TOKENU: ${CHAT_KARTA_MAX_TOKENU:-}
      CHAT_SOUBEH_CELKEM: ${CHAT_SOUBEH_CELKEM:-}
      CHAT_SOUBEH_IP: ${CHAT_SOUBEH_IP:-}
      CHAT_TURNSTILE_ZPRAV: ${CHAT_TURNSTILE_ZPRAV:-}
      CHAT_TURNSTILE_HODIN: ${CHAT_TURNSTILE_HODIN:-}
      CHAT_TURNSTILE_PRISNY_PRAH: ${CHAT_TURNSTILE_PRISNY_PRAH:-}
      CHAT_DRZENI_TAHU_S: ${CHAT_DRZENI_TAHU_S:-}
      CHAT_MAX_NAHLASENI_DEN: ${CHAT_MAX_NAHLASENI_DEN:-}
      CHAT_PROVOZOVATEL: ${CHAT_PROVOZOVATEL:-}
    ports:
      - "${CHAT_BIND:-127.0.0.1:8103}:8000"
    networks: [chatdb]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.75
    depends_on: [db]

  # Reels: Telegram bot pro schválení a publikaci na FB, IG a Threads; video do fronty dá reels-enqueue (viz reels/README.md)
  reels:
    build:
      context: ../reels
    restart: unless-stopped
    # jen PG* (ne celé *ragenv: klíč OpenAI a Sentry rag sem nepatří)
    environment:
      PGHOST: db
      PGDATABASE: hlidac
      PGUSER: hlidac
      PGPASSWORD: ${DB_PASSWORD}
      META_SYSTEM_TOKEN: ${META_SYSTEM_TOKEN:-}
      META_PAGE_ID: ${META_PAGE_ID:-}
      META_IG_USER_ID: ${META_IG_USER_ID:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
      REELS_TELEGRAM_TOKEN: ${REELS_TELEGRAM_TOKEN:-}
      REELS_TELEGRAM_CHAT_ID: ${REELS_TELEGRAM_CHAT_ID:-}
      REELS_PUBLIC_BASE: ${REELS_PUBLIC_BASE:-https://cosepece.cz/reels-media}
      REELS_MEDIA_DIR: /media
      REELS_INBOX_DIR: /inbox
      # Threads (volitelné): bez THREADS_USER_ID bot publikuje jen na FB a IG
      THREADS_USER_ID: ${THREADS_USER_ID:-}
      THREADS_TOKEN: ${THREADS_TOKEN:-}
      THREADS_GRAPH_VERSION: ${THREADS_GRAPH_VERSION:-v1.0}
    volumes:
      - reelsmedia:/media
      # mezisložka od reels_api.php (čte a po převzetí maže)
      - reelsinbox:/inbox
    mem_limit: 256m
    depends_on: [db]

  db:
    # PostgreSQL 17 s rozšířením pgvector (pro sémantické hledání). Varianta trixie má stejnou glibc
    # jako původní postgres:17, jinak hrozí nesoulad collation a poškozené řazení textových indexů.
    image: pgvector/pgvector:pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: hlidac
      POSTGRES_USER: hlidac
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # default pro ostatní služby, chatdb jen pro chat (chat tak nedosáhne na web, mcp ani reels)
    networks: [default, chatdb]

volumes:
  appdata:
  pgdata:
  reelsmedia:
  reelsinbox:

networks:
  # síť služby chat: jen chat a db; odchozí spojení do internetu (Anthropic, OpenAI, Turnstile, Telegram) zůstává
  chatdb: {}
