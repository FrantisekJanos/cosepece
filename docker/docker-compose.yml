# Provoz na serveru: docker compose -f docker/docker-compose.yml up -d --build
# Proměnné v docker/.env (vzor docker/.env.example).
services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment: &appenv
      HLIDAC_CONFIG: /run/hlidac/config.php
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: ${APP_KEY:-}
      CACHE_STORE: file
      LOG_CHANNEL: stderr
    ports:
      - "${BIND:-127.0.0.1:8100}:80"
    volumes:
      - ./config.php:/run/hlidac/config.php:ro
      - appdata:/var/www/html/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Laravel scheduler: synchronizace každou hodinu, zámek proti souběhu
  sync:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment: *appenv
    user: www-data
    volumes:
      - ./config.php:/run/hlidac/config.php:ro
      - appdata:/var/www/html/data
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      web:
        condition: service_healthy

  # stenoprotokoly psp.cz → steno.* (každou hodinu; změny textu hlídá hash části)
  rag-ingest:
    build:
      context: ../rag
    restart: unless-stopped
    environment: &ragenv
      PGHOST: db
      PGDATABASE: hlidac
      PGUSER: hlidac
      PGPASSWORD: ${DB_PASSWORD}
    command: ["sh", "-c", "while true; do python -m hlidac_rag.run; sleep 3600; done"]
    depends_on: [db]

  # MCP server (Streamable HTTP na /mcp, přístup tokenem: python -m hlidac_rag.tokens add <jméno>)
  mcp:
    build:
      context: ../rag
    restart: unless-stopped
    environment:
      <<: *ragenv
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*}
    ports:
      - "${MCP_BIND:-127.0.0.1:8102}:8000"
    depends_on: [db]

  db:
    # PostgreSQL 17 s rozšířením pgvector (pro sémantické hledání). Varianta trixie má stejnou glibc
    # jako původní postgres:17, jinak hrozí nesoulad collation a poškozené řazení textových indexů.
    image: pgvector/pgvector:pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: hlidac
      POSTGRES_USER: hlidac
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hlidac -d hlidac"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  appdata:
  pgdata:
