# Provoz na serveru: docker compose -f docker/docker-compose.yml up -d --build
# Proměnné v docker/.env (vzor docker/.env.example).
services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment: &appenv
      HLIDAC_CONFIG: /run/hlidac/config.php
      DB_PASSWORD: ${DB_PASSWORD}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    ports:
      - "${BIND:-127.0.0.1:8100}:80"
    volumes:
      - ./config.php:/run/hlidac/config.php:ro
      - appdata:/var/www/html/data
      # veřejné kopie videí pro Instagram (/reels-media/<token>.mp4, Alias v docker/Dockerfile), jen čtení
      - reelsmedia:/srv/reels-media:ro
    depends_on: [db]

  # synchronizace s psp.cz každou hodinu (náhrada cronu)
  sync:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment: *appenv
    user: www-data
    volumes:
      - ./config.php:/run/hlidac/config.php:ro
      - appdata:/var/www/html/data
    # synchronizace potřebuje víc paměti než webová stránka (webu stačí 256M z app.ini)
    command: ["sh", "-c", "while true; do php -d memory_limit=1024M /var/www/html/bin/sync.php; sleep 3600; done"]
    depends_on: [db]

  # stenoprotokoly psp.cz → steno.* (každou hodinu; změny textu hlídá hash části)
  rag-ingest:
    build:
      context: ../rag
    restart: unless-stopped
    environment: &ragenv
      PGHOST: db
      PGDATABASE: hlidac
      PGUSER: hlidac
      PGPASSWORD: ${DB_PASSWORD}
      SENTRY_DSN: ${SENTRY_DSN_RAG:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-text-embedding-3-large}
      # stropy útraty OpenAI: tokeny indexace na hodinový běh (3 mil. ≈ 0,39 USD), embeddingy dotazů MCP za den (UTC)
      EMBED_MAX_TOKENS_PER_RUN: ${EMBED_MAX_TOKENS_PER_RUN:-3000000}
      EMBED_DOTAZY_DEN: ${EMBED_DOTAZY_DEN:-20000}
    command: ["sh", "-c", "while true; do python -m hlidac_rag.run; sleep 3600; done"]
    depends_on: [db]

  # MCP server (Streamable HTTP na /mcp, přístup tokenem: python -m hlidac_rag.tokens add <jméno>)
  mcp:
    build:
      context: ../rag
    restart: unless-stopped
    environment:
      <<: *ragenv
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*}
    ports:
      - "${MCP_BIND:-127.0.0.1:8102}:8000"
    depends_on: [db]

  # Reels: Telegram bot pro schválení a publikaci na FB, IG a Threads; video do fronty dá reels-enqueue (viz reels/README.md)
  reels:
    build:
      context: ../reels
    restart: unless-stopped
    # jen PG* (ne celé *ragenv: klíč OpenAI a Sentry rag sem nepatří)
    environment:
      PGHOST: db
      PGDATABASE: hlidac
      PGUSER: hlidac
      PGPASSWORD: ${DB_PASSWORD}
      META_SYSTEM_TOKEN: ${META_SYSTEM_TOKEN:-}
      META_PAGE_ID: ${META_PAGE_ID:-}
      META_IG_USER_ID: ${META_IG_USER_ID:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
      REELS_TELEGRAM_TOKEN: ${REELS_TELEGRAM_TOKEN:-}
      REELS_TELEGRAM_CHAT_ID: ${REELS_TELEGRAM_CHAT_ID:-}
      REELS_PUBLIC_BASE: ${REELS_PUBLIC_BASE:-https://cosepece.cz/reels-media}
      REELS_MEDIA_DIR: /media
      # Threads (volitelné): bez THREADS_USER_ID bot publikuje jen na FB a IG
      THREADS_USER_ID: ${THREADS_USER_ID:-}
      THREADS_TOKEN: ${THREADS_TOKEN:-}
      THREADS_GRAPH_VERSION: ${THREADS_GRAPH_VERSION:-v1.0}
    volumes:
      - reelsmedia:/media
    mem_limit: 256m
    depends_on: [db]

  db:
    # PostgreSQL 17 s rozšířením pgvector (pro sémantické hledání). Varianta trixie má stejnou glibc
    # jako původní postgres:17, jinak hrozí nesoulad collation a poškozené řazení textových indexů.
    image: pgvector/pgvector:pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: hlidac
      POSTGRES_USER: hlidac
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  appdata:
  pgdata:
  reelsmedia:
