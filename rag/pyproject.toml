[project]
name = "hlidac-rag"
version = "0.1.0"
description = "Stenoprotokoly Poslanecké sněmovny a MCP server pro Hlídač zákonů"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]==3.3.9",
  "psycopg-pool==3.3.3",
  "mcp==2.3.0",
  "uvicorn==0.54.0",
  "sentry-sdk==2.75.0",
  "anthropic==2.14.0",
  "starlette==1.10.0",
  "httpx2==2.16.2",
]

[project.optional-dependencies]
dev = ["pytest", "pyyaml"]

[tool.setuptools.packages.find]
include = ["hlidac_rag*"]

[tool.setuptools.package-data]
hlidac_rag = ["schema.sql", "schema_*.sql"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
  "pg: testy nad PostgreSQL (potřebují DATABASE_URL, jinak se přeskočí)",
]
