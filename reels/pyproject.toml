[project]
name = "hlidac-reels"
version = "0.1.0"
description = "Reels z hlavních nálezů Hlídače zákonů: render videa, fronta a Telegram bot"
requires-python = ">=3.12"
# kontejner (bot, reels-enqueue) potřebuje jen tyto; render videa běží lokálně: pip install -e ".[render,dev]"
dependencies = [
  "psycopg[binary]==3.3.9",
  "httpx==0.28.1",
]

[project.optional-dependencies]
render = ["playwright==1.49.1", "numpy>=2.0"]
dev = ["pytest"]

[project.scripts]
reels-enqueue = "hlidac_reels.enqueue:main"
reels-add-landscape = "hlidac_reels.enqueue:add_landscape_main"
reels-bot = "hlidac_reels.bot:main"
reels-threads-backfill = "hlidac_reels.backfill:main"
reels-generate = "hlidac_reels.generator.generate:main"
reels-worker = "hlidac_reels.generator.worker:main"
reels-audit-atribuce = "hlidac_reels.audit_atribuce:main"

[tool.setuptools.packages.find]
include = ["hlidac_reels*"]

[tool.setuptools.package-data]
hlidac_reels = ["template/*", "template/fonts/*", "template_v2/*", "template_v3/*", "template_pn_v1/*", "schema_reels.sql", "generator/prompts/*", "generator/examples/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
  "render: testy renderu (potřebují Chromium a ffmpeg, jinak se přeskočí)",
  "pg: testy nad PostgreSQL (potřebují DATABASE_URL, jinak se přeskočí)",
]
